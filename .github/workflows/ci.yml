# CI: 每次 push / PR 跑 typecheck + 测试，确保主分支始终可发布。
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 词库同步守卫：data/ 变更必须连带重新生成 generated.ts 提交
      # （同时拦截手改生成物——两种漂移都让 diff 非空而红）。
      - name: Dict sync guard
        run: |
          npm run gendict
          git diff --exit-code -- src/proofread-dict-data.generated.ts

      - name: Run tests (build first)
        run: npm test
